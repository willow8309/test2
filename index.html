<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To-infinitive or Gerund?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #4d4a5f;

      background: linear-gradient(
        135deg,
        #fff5f8 0%,
        #f6f2ff 45%,
        #eef9ff 100%
      );
    }

    .container {
      width: 92%;
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    /* 상단 */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #8d83b5;
    }

    .timer {
      background: #ffe8f0;
      color: #a96980;
      padding: 9px 15px;
      border-radius: 30px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* 제목 */

    h1 {
      text-align: center;
      margin: 20px 0 8px;
      font-family: Georgia, serif;
      font-size: 36px;
      color: #57516f;
    }

    .subtitle {
      text-align: center;
      color: #777386;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    /* 진행바 */

    .progress-bg {
      width: 100%;
      height: 11px;
      background: #eae6f1;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 20px;

      background: linear-gradient(
        90deg,
        #a9ddcd,
        #a9cfee,
        #c6b6ee
      );

      transition: width 0.3s ease;
    }

    /* 문제 카드 */

    .card {
      background: rgba(255,255,255,0.96);
      border: 2px solid #ece6f4;
      border-radius: 25px;
      padding: 28px;

      box-shadow:
        0 12px 30px rgba(95,80,120,0.08);
    }

    .question-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #8c8799;
    }

    .question {
      text-align: center;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.6;
      margin: 32px 0;
      color: #454255;
    }

    .blank {
      color: #8c7fc0;
      border-bottom: 3px solid #b6a9df;
      padding: 0 12px;
    }

    /* 선택지 */

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .choice {
      border: none;
      border-radius: 18px;
      padding: 18px 12px;
      font-size: 17px;
      font-weight: 800;
      color: #555266;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .choice:first-child {
      background: #dff2ff;
    }

    .choice:last-child {
      background: #def5eb;
    }

    .choice:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 15px rgba(80,70,110,0.12);
    }

    .choice:disabled {
      cursor: default;
      opacity: 0.55;
      transform: none;
    }

    /* 피드백 */

    .feedback {
      margin-top: 20px;
      min-height: 95px;

      padding: 17px 19px;

      border-radius: 18px;

      background: linear-gradient(
        135deg,
        #fff8df,
        #fff0e9
      );

      line-height: 1.65;
      color: #645e69;
    }

    .feedback-title {
      display: block;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .hint {
      color: #b46f65;
    }

    .correct {
      color: #4f9278;
    }

    .wrong {
      color: #b46f65;
    }

    /* 다음 버튼 */

    .next-btn {
      width: 100%;
      margin-top: 16px;
      padding: 15px;

      border: none;
      border-radius: 17px;

      background: linear-gradient(
        90deg,
        #aea3db,
        #91bad9
      );

      color: white;
      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    .next-btn:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    /* 하단 태그 */

    .tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }

    .tag {
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      color: #716c7e;
    }

    .tag:nth-child(1) {
      background: #ffe7ef;
    }

    .tag:nth-child(2) {
      background: #def5eb;
    }

    .tag:nth-child(3) {
      background: #eee7ff;
    }

    /* 마지막 화면 */

    .finish {
      text-align: center;
    }

    .finish-icon {
      font-size: 48px;
    }

    .score {
      font-family: Georgia, serif;
      font-size: 55px;
      font-weight: bold;
      color: #8277b2;
      margin: 12px 0;
    }

    .rule-box {
      margin-top: 22px;
      padding: 18px;
      background: #f5f0ff;
      border-radius: 18px;
      text-align: left;
      line-height: 1.7;
    }

    @media (max-width: 550px) {

      h1 {
        font-size: 29px;
      }

      .card {
        padding: 21px;
      }

      .question {
        font-size: 21px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>


<body>

<div class="container">

  <div class="top">
    <div class="label">
      2 MIN · GRAMMAR SPRINT
    </div>

    <div class="timer" id="timer">
      02:00
    </div>
  </div>


  <h1>
    To-infinitive or Gerund?
  </h1>


  <div class="subtitle">
    문장을 읽고
    <strong>to + 동사원형</strong>과
    <strong>동명사(-ing)</strong> 중<br>
    알맞은 표현을 골라 보세요 🌷
  </div>


  <div class="progress-bg">
    <div
      class="progress-bar"
      id="progressBar">
    </div>
  </div>


  <div
    class="card"
    id="card">
  </div>


  <div class="tags">
    <div class="tag">🌸 최대 3번 시도</div>
    <div class="tag">🌿 단계별 힌트</div>
    <div class="tag">💜 마지막엔 상세 해설</div>
  </div>

</div>


<script>

  const questions = [

    {
      sentence:
        "I want ___ a new language.",

      choices:
        ["to learn", "learning"],

      answer:
        "to learn",

      hints: [
        "want 뒤에 오는 동사의 형태를 떠올려 보세요.",
        "‘~하고 싶다’는 want + to + 동사원형으로 표현해요."
      ],

      explanation:
        "want는 뒤에 to부정사를 목적어로 취합니다. 따라서 <b>want to learn</b>이 맞습니다. ‘새로운 언어를 배우고 싶다’라는 뜻이에요."
    },


    {
      sentence:
        "She enjoys ___ music after school.",

      choices:
        ["to listen to", "listening to"],

      answer:
        "listening to",

      hints: [
        "enjoy 뒤에는 to부정사보다 -ing 형태가 와요.",
        "enjoy + 동명사(-ing) = ‘~하는 것을 즐기다’입니다."
      ],

      explanation:
        "enjoy는 뒤에 <b>동명사(-ing)</b>를 목적어로 취합니다. 따라서 <b>enjoys listening to music</b>이 맞습니다."
    },


    {
      sentence:
        "We decided ___ home early.",

      choices:
        ["to go", "going"],

      answer:
        "to go",

      hints: [
        "decide는 ‘~하기로 결정하다’라는 뜻이에요.",
        "decide + to + 동사원형의 형태를 사용합니다."
      ],

      explanation:
        "decide는 뒤에 <b>to부정사</b>가 옵니다. <b>decide to go</b>는 ‘가기로 결정하다’라는 뜻입니다."
    },


    {
      sentence:
        "My brother finished ___ his homework.",

      choices:
        ["to do", "doing"],

      answer:
        "doing",

      hints: [
        "finish는 어떤 행동을 ‘끝내다’라는 뜻이에요.",
        "finish 뒤에는 동명사(-ing)가 옵니다."
      ],

      explanation:
        "finish는 뒤에 <b>동명사</b>를 목적어로 취합니다. 따라서 <b>finished doing his homework</b>가 맞습니다."
    },


    {
      sentence:
        "Jina hopes ___ a doctor someday.",

      choices:
        ["to become", "becoming"],

      answer:
        "to become",

      hints: [
        "hope는 앞으로 하고 싶은 일을 나타낼 때 자주 사용해요.",
        "hope + to + 동사원형 형태를 사용합니다."
      ],

      explanation:
        "hope 뒤에는 <b>to부정사</b>가 옵니다. 따라서 <b>hopes to become a doctor</b>가 맞습니다."
    },


    {
      sentence:
        "They practiced ___ English together.",

      choices:
        ["to speak", "speaking"],

      answer:
        "speaking",

      hints: [
        "practice는 어떤 행동을 반복해서 ‘연습하다’라는 뜻이에요.",
        "practice 뒤에는 -ing 형태를 사용합니다."
      ],

      explanation:
        "practice는 뒤에 <b>동명사(-ing)</b>를 목적어로 취합니다. 따라서 <b>practiced speaking English</b>가 맞습니다."
    }

  ];


  let currentQuestion = 0;

  let attempts = 0;

  let score = 0;

  let answered = false;

  let timeLeft = 120;


  const card =
    document.getElementById("card");

  const progressBar =
    document.getElementById("progressBar");

  const timer =
    document.getElementById("timer");


  function showQuestion() {

    answered = false;

    attempts = 0;


    if (
      currentQuestion >=
      questions.length
    ) {

      showResult();

      return;

    }


    const q =
      questions[currentQuestion];


    const progress =
      (currentQuestion /
      questions.length) * 100;


    progressBar.style.width =
      progress + "%";


    card.innerHTML = `

      <div class="question-info">

        <span>
          QUESTION
          ${currentQuestion + 1}
          /
          ${questions.length}
        </span>

        <span id="attemptText">
          시도 1 / 3
        </span>

      </div>


      <div class="question">

        ${q.sentence.replace(
          "___",
          '<span class="blank">?</span>'
        )}

      </div>


      <div class="choices">

        <button
          class="choice"
          onclick="checkAnswer('${q.choices[0]}')">

          ${q.choices[0]}

        </button>


        <button
          class="choice"
          onclick="checkAnswer('${q.choices[1]}')">

          ${q.choices[1]}

        </button>

      </div>


      <div
        class="feedback"
        id="feedback">

        💭

        <span class="feedback-title">
          먼저 생각해 보세요!
        </span>

        앞에 있는 동사가
        뒤에 어떤 형태를 요구하는지
        떠올려 보세요.

      </div>


      <button
        class="next-btn hidden"
        id="nextButton"
        onclick="nextQuestion()">

        다음 문제 →

      </button>

    `;
  }


  function checkAnswer(selected) {

    if (answered) {
      return;
    }


    const q =
      questions[currentQuestion];


    const feedback =
      document.getElementById(
        "feedback"
      );


    /* 정답 */

    if (
      selected ===
      q.answer
    ) {

      answered = true;

      score++;


      feedback.innerHTML = `

        <span class="correct">

          <span class="feedback-title">
            🌟 정답이에요!
          </span>

          <b>${q.answer}</b>가
          알맞은 표현이에요.

        </span>

      `;


      disableChoices();


      document
        .getElementById(
          "nextButton"
        )
        .classList
        .remove("hidden");


      return;
    }


    /* 오답 */

    attempts++;


    /* 첫 번째, 두 번째 오답 */

    if (
      attempts < 3
    ) {

      document
        .getElementById(
          "attemptText"
        )
        .textContent =
          "시도 " +
          (attempts + 1) +
          " / 3";


      feedback.innerHTML = `

        <span class="hint">

          <span class="feedback-title">
            💡 힌트 ${attempts}
          </span>

          ${q.hints[attempts - 1]}

        </span>

        <br>

        다시 한 번 골라 보세요!

      `;

    }


    /* 세 번째까지 오답 */

    else {

      answered = true;


      feedback.innerHTML = `

        <span class="wrong">

          <span class="feedback-title">
            🌱 정답은
            ${q.answer} 입니다.
          </span>

        </span>

        ${q.explanation}

      `;


      disableChoices();


      document
        .getElementById(
          "nextButton"
        )
        .classList
        .remove("hidden");

    }

  }


  function disableChoices() {

    const buttons =
      document.querySelectorAll(
        ".choice"
      );


    buttons.forEach(
      function(button) {

        button.disabled = true;

      }
    );

  }


  function nextQuestion() {

    currentQuestion++;

    showQuestion();

  }


  function showResult() {

    progressBar.style.width =
      "100%";


    let message = "";


    if (
      score ===
      questions.length
    ) {

      message =
        "Perfect! 문법 감각이 아주 좋아요! 🌟";

    }

    else if (
      score >= 4
    ) {

      message =
        "Great job! 거의 다 구별했어요! 🌷";

    }

    else {

      message =
        "Good try! 한 번 더 하면 더 쉬워질 거예요 🌱";

    }


    card.innerHTML = `

      <div class="finish">

        <div class="finish-icon">
          🎉
        </div>

        <div class="score">
          ${score}
          /
          ${questions.length}
        </div>

        <h2>
          ${message}
        </h2>


        <div class="rule-box">

          <b>💜 오늘의 핵심</b>

          <br><br>

          🌸
          <b>to부정사를 쓰는 동사</b>
          <br>

          want to ~
          <br>

          decide to ~
          <br>

          hope to ~

          <br><br>

          🌿
          <b>동명사를 쓰는 동사</b>
          <br>

          enjoy -ing
          <br>

          finish -ing
          <br>

          practice -ing

        </div>


        <button
          class="next-btn"
          onclick="restartQuiz()">

          🔄 다시 도전하기

        </button>

      </div>

    `;

  }


  function restartQuiz() {

    currentQuestion = 0;

    attempts = 0;

    score = 0;

    answered = false;

    timeLeft = 120;


    updateTimer();

    showQuestion();

  }


  function updateTimer() {

    const minutes =
      Math.floor(
        timeLeft / 60
      );


    const seconds =
      timeLeft % 60;


    timer.textContent =
      String(minutes)
        .padStart(2, "0")
      +
      ":"
      +
      String(seconds)
        .padStart(2, "0");

  }


  setInterval(
    function() {

      if (
        timeLeft > 0
      ) {

        timeLeft--;

        updateTimer();

      }

    },
    1000
  );


  updateTimer();

  showQuestion();

</script>

</body>
</html>
